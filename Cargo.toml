[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
large_stack_frames = "deny"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
jiff = { version = "0.2", features = ["serde"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ulid = "3"
tasky-core = { path = "crates/tasky-core" }
tasky-store = { path = "crates/tasky-store" }
tasky-ui = { path = "crates/tasky-ui" }

# Optimize dependencies (GPUI in particular) even in dev builds; our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
